[package]
name = "wavekat-turn"
description = "Unified turn detection with multiple backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/wavekat/wavekat-turn"
homepage = "https://github.com/wavekat/wavekat-turn"
documentation = "https://docs.rs/wavekat-turn"
readme = "../../README.md"
keywords = ["turn-detection", "voice", "audio", "telephony", "wavekat"]
categories = ["multimedia::audio"]
exclude = ["CHANGELOG.md"]
build = "build.rs"

[features]
default = []
pipecat = ["dep:ort", "dep:ndarray", "dep:realfft", "dep:ureq"]
livekit = ["dep:ort", "dep:ndarray"]

[dependencies]
wavekat-core = "0.0.2"
thiserror = "2"

# ONNX backends (optional)
ort = { version = "2.0.0-rc.12", optional = true, features = ["ndarray"] }
ndarray = { version = "0.17", optional = true }
realfft = { version = "3", optional = true }

[build-dependencies]
ureq = { version = "3", optional = true }

[dev-dependencies]
hound = "3.5"
ndarray-npy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "controller"
required-features = ["pipecat"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
