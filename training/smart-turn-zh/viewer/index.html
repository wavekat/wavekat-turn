<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Viewer</title>
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div id="file-controls">
        <label class="file-btn">Open files<input type="file" multiple id="multi-input" hidden></label>
        <span class="status" id="wav-status"></span>
        <span class="status" id="vad-status"></span>
        <span class="status" id="asr-status"></span>
      </div>
      <div id="zoom-levels">
        <button class="zoom-btn" data-span="1">1s</button>
        <button class="zoom-btn" data-span="20">20s</button>
        <button class="zoom-btn" data-span="80">1m</button>
        <button class="zoom-btn" data-span="300">5m</button>
        <button class="zoom-btn" data-span="1200">20m</button>
        <button class="zoom-btn" data-span="0">Full</button>
      </div>
      <div id="playback-controls">
        <select id="channel-select" disabled><option value="-1">All</option></select>
        <button id="play-btn" disabled title="Space">&#9654;</button>
        <label id="gain-label">Vol <input type="range" id="gain-slider" min="0" max="20" step="0.1" value="10"><span id="gain-value">10.0x</span></label>
        <span id="time-display">--:-- / --:--</span>
      </div>
    </header>

    <div id="tracks">
      <div class="track" id="waveform-track">
        <span class="track-label">Waveform</span>
        <div id="wf-scale" class="scale-toggle">
          <button class="scale-btn" data-scale="linear">Linear</button>
          <button class="scale-btn active" data-scale="dB">dB</button>
        </div>
        <canvas id="waveform-canvas"></canvas>
      </div>
      <div class="track" id="vad-track">
        <span class="track-label">VAD</span>
        <canvas id="vad-canvas"></canvas>
        <div id="vad-thresholds">
          <label>Entry <input type="number" id="vad-entry" value="0.3" min="0" max="1" step="0.05"></label>
          <label>Exit <input type="number" id="vad-exit" value="0.1" min="0" max="1" step="0.05"></label>
        </div>
      </div>
    </div>

    <canvas id="minimap-canvas"></canvas>

    <div id="asr-panel">
      <div id="search-bar">
        <input type="text" id="search-input" placeholder="Search ASR text... (F to focus)">
        <button id="prev-btn" disabled title="Shift+Enter">&#9664;</button>
        <span id="search-count"></span>
        <button id="next-btn" disabled title="Enter">&#9654;</button>
      </div>
      <div id="transcript-list"></div>
    </div>
  </div>

  <div id="drop-overlay" hidden>Drop WAV / NPY / JSON files</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
