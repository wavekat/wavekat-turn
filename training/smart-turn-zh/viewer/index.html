<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Viewer</title>
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div id="file-controls">
        <label class="file-btn">WAV<input type="file" accept=".wav" id="wav-input" hidden><span class="status" id="wav-status"></span></label>
        <label class="file-btn">VAD (.npy)<input type="file" accept=".npy" id="vad-input" hidden><span class="status" id="vad-status"></span></label>
        <label class="file-btn">ASR (.json)<input type="file" accept=".json" id="asr-input" hidden><span class="status" id="asr-status"></span></label>
      </div>
      <div id="playback-controls">
        <select id="channel-select" disabled><option value="-1">All</option></select>
        <button id="play-btn" disabled title="Space">&#9654;</button>
        <span id="time-display">--:-- / --:--</span>
      </div>
    </header>

    <div id="tracks">
      <div class="track" id="waveform-track">
        <span class="track-label">Waveform</span>
        <canvas id="waveform-canvas"></canvas>
      </div>
      <div class="track" id="vad-track">
        <span class="track-label">VAD</span>
        <canvas id="vad-canvas"></canvas>
        <div id="vad-thresholds">
          <label>Entry <input type="number" id="vad-entry" value="0.3" min="0" max="1" step="0.05"></label>
          <label>Exit <input type="number" id="vad-exit" value="0.1" min="0" max="1" step="0.05"></label>
        </div>
      </div>
    </div>

    <canvas id="minimap-canvas"></canvas>

    <div id="asr-panel">
      <div id="search-bar">
        <input type="text" id="search-input" placeholder="Search ASR text... (F to focus)">
        <button id="prev-btn" disabled title="Shift+Enter">&#9664;</button>
        <span id="search-count"></span>
        <button id="next-btn" disabled title="Enter">&#9654;</button>
      </div>
      <div id="transcript-list"></div>
    </div>
  </div>

  <div id="drop-overlay" hidden>Drop WAV / NPY / JSON files</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
